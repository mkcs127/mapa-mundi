<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Baloo 2',system-ui,sans-serif;color:#1f2a44;background:radial-gradient(circle at 50% 45%,#fdf8ee 0%,#f4ecdc 70%)}
a{color:#2c5fd6}a:hover{color:#1b3f99}
#stage{position:fixed;inset:0}
#stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#stage svg.dragging{cursor:grabbing}
.country{stroke:#fff;stroke-width:.7;cursor:pointer;transition:opacity .25s}
.country:hover{filter:brightness(1.08)}
.country.dim{opacity:.28}
.country.sel{stroke:#1f2a44;stroke-width:2}
.cap-dot{fill:#fff;stroke:#1f2a44;stroke-width:1.3;cursor:pointer}
.cap-dot.sel{fill:#ff5a5f;stroke:#fff;stroke-width:2}
.cap-label{font-weight:700;fill:#1f2a44;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.cap-label.sel{fill:#d92f3a}
.panel{position:fixed;background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(31,42,68,.12),0 12px 30px rgba(31,42,68,.12)}
#top{top:16px;left:16px;bottom:16px;padding:12px 8px;width:112px;display:flex;flex-direction:column;gap:10px;border-radius:18px}
h1{margin:0 4px;font-size:18px;line-height:1;font-weight:800;letter-spacing:-.01em}
h1 span{color:#ff5a5f}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:13px;font-weight:600;padding:6px 8px;border-radius:10px;border:2.5px solid #e6dcc8;outline:none;background:#fdfaf3;color:#1f2a44}
.search input:focus{border-color:#2c5fd6;background:#fff}
#results{position:absolute;left:0;width:280px;top:calc(100% + 6px);background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(31,42,68,.18);overflow:hidden;z-index:5;max-height:300px;overflow-y:auto}
#results button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;font-size:16px;font-weight:600;padding:8px 12px;text-align:left;cursor:pointer;color:#1f2a44}
#results button:hover,#results button.active{background:#eef3ff}
#results img{width:28px;height:19px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
#results small{margin-left:auto;color:#6b7590;font-weight:500}
.chips{display:flex;flex-direction:column;gap:4px}
.chips-title{margin:4px 4px 0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7590}
.chip{font:inherit;font-size:12px;line-height:1.15;font-weight:700;border:0;border-radius:10px;padding:5px 6px 3px;cursor:pointer;background:none;color:#1f2a44;display:flex;align-items:center;gap:6px;text-align:left}
.chip:hover{background:#f6f0e4}
.chip i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.chip.on{background:#1f2a44;color:#fff}
#card{right:16px;top:16px;width:min(320px,calc(100vw - 32px));padding:16px;display:flex;flex-direction:column;gap:12px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.25s}
#card.show{transform:none;opacity:1;pointer-events:auto}
#card .flag{width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:#f1ebde;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
#card .flag img{width:100%;height:100%;object-fit:cover;display:block}
#card h2{margin:0;font-size:30px;line-height:1.05;font-weight:800;text-wrap:pretty}
.facts{display:grid;gap:8px}
.fact{display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:8px;padding:8px 12px;border-radius:12px;background:#fbf7ef}
.fact b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#6b7590;font-weight:700}
.fact span{font-size:18px;font-weight:700}
#close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font:inherit;font-size:20px;font-weight:800;cursor:pointer;color:#1f2a44;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#tools{right:16px;bottom:16px;padding:6px;display:flex;flex-direction:column;gap:6px}
#tools button{width:44px;height:44px;border-radius:14px;border:0;background:#f1ebde;font:inherit;font-size:22px;font-weight:800;cursor:pointer;color:#1f2a44;display:grid;place-items:center}
#tools button:hover{background:#e6dcc8}
#tools button.on{background:#1f2a44;color:#fff}
#hint{position:fixed;left:calc(50% + 68px);bottom:16px;transform:translateX(-50%);font-size:15px;font-weight:600;color:#6b7590;background:rgba(255,255,255,.8);padding:4px 14px 2px;border-radius:999px;white-space:nowrap}
#tip{position:fixed;pointer-events:none;background:#1f2a44;color:#fff;font-weight:700;font-size:15px;padding:4px 10px 2px;border-radius:10px;opacity:0;transition:opacity .15s;display:flex;align-items:center;gap:8px}
#tip img{width:22px;height:15px;border-radius:3px;object-fit:cover}
#card{max-height:calc(100vh - 210px);overflow-y:auto}
@media (max-height:760px){#card .flag{aspect-ratio:2/1}#card h2{font-size:24px}.fact{padding:6px 10px}}
@media (min-width:721px) and (max-height:620px){#tools{flex-direction:row;right:auto;left:152px;bottom:16px}#card{max-height:calc(100vh - 32px)}#hint{display:none}}
@media (max-width:720px){#top{bottom:auto;right:16px;width:auto;padding:12px}.chips{flex-direction:row;flex-wrap:wrap}.chips-title{display:none}.chip{font-size:13px;padding:4px 10px 2px;background:#f1ebde}#results{width:100%}#tools{bottom:auto;top:45%}#card{z-index:3;top:auto;bottom:16px;right:16px;left:16px;width:auto}#card .flag{aspect-ratio:3/1.4}#hint{display:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="top" class="panel">
  <h1>Mapa <span>Mundi</span></h1>
  <div class="search">
    <input id="q" type="text" placeholder="Buscar…" autocomplete="off">
    <div id="results" hidden></div>
  </div>
  <div class="chips-title">Continentes</div>
  <div class="chips" id="chips"></div>
</div>

<div id="card" class="panel">
  <button id="close" aria-label="Cerrar">×</button>
  <div class="flag"><img id="c-flag" alt=""></div>
  <h2 id="c-name"></h2>
  <div class="facts">
    <div class="fact"><b>Capital</b><span id="c-cap"></span></div>
    <div class="fact"><b>Continente</b><span id="c-cont"></span></div>
    <div class="fact"><b>Idioma</b><span id="c-lang"></span></div>
  </div>
</div>

<div id="tools" class="panel">
  <button id="zin" title="Acercar">+</button>
  <button id="zout" title="Alejar">−</button>
  <button id="spin" class="on" title="Girar solo">⟳</button>
</div>
<div id="hint">Arrastra para girar el globo · rueda para hacer zoom · toca un país</div>
<div id="tip"></div>

const DATA = {};
RAW.trim().split('\n').forEach(l => {
  const [id,iso,name,cap,lat,lon,cont,lang] = l.split('|');
  DATA[id] = {id,iso,name,cap,lat:+lat,lon:+lon,cont,lang};
});
const NAME_FALLBACK = {'Kosovo':'-1','Somaliland':'706','N. Cyprus':'196'};
const LIST = Object.values(DATA);
const flagUrl = iso => `https://flagcdn.com/w320/${iso}.png`;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const state = { sel:null, cont:null, scale:1, spin:true };
const stage = document.getElementById('stage');
const svg = d3.select(stage).append('svg');
const defs = svg.append('defs');
const grad = defs.append('radialGradient').attr('id','ocean').attr('cx','38%').attr('cy','32%').attr('r','75%');
grad.append('stop').attr('offset','0%').attr('stop-color','#8fd3ff');
grad.append('stop').attr('offset','100%').attr('stop-color','#3a8fe0');
const shade = defs.append('radialGradient').attr('id','shade').attr('cx','38%').attr('cy','32%').attr('r','75%');
shade.append('stop').attr('offset','60%').attr('stop-color','#000').attr('stop-opacity',0);
shade.append('stop').attr('offset','100%').attr('stop-color','#0a2a5a').attr('stop-opacity',.28);

const gHalo = svg.append('circle').attr('fill','#bfe6ff').attr('opacity',.45);
const gSphere = svg.append('path').attr('fill','url(#ocean)');
const gGrat = svg.append('path').attr('fill','none').attr('stroke','#fff').attr('stroke-opacity',.22).attr('stroke-width',.8);
const gLand = svg.append('g');
const gShade = svg.append('path').attr('fill','url(#shade)').attr('pointer-events','none');
const gCaps = svg.append('g');

const projection = d3.geoOrthographic().clipAngle(90).precision(.4).rotate([60,-15]);
const path = d3.geoPath(projection);
const graticule = d3.geoGraticule10();
let W, H, baseR, features = [];

function size(){
  W = stage.clientWidth; H = stage.clientHeight;
  const side = W > 720 ? 136 : 0;
  baseR = Math.min(W - side, H) * 0.42;
  projection.translate([side + (W - side)/2, H/2 + (W < 720 ? 40 : 0)]);
  applyScale();
}
function applyScale(){ projection.scale(baseR * state.scale); render(); }

const tip = document.getElementById('tip');
function render(){
  if (!features.length) return;
  const [cx, cy] = projection.translate(), r = projection.scale();
  gHalo.attr('cx',cx).attr('cy',cy).attr('r',r+14);
  gSphere.attr('d', path({type:'Sphere'}));
  gShade.attr('d', path({type:'Sphere'}));
  gGrat.attr('d', path(graticule));
  gLand.selectAll('path').attr('d', path)
    .classed('dim', d => state.cont && (!d.info || d.info.cont !== state.cont))
    .classed('sel', d => state.sel && d.info === state.sel);
  drawCaps();
}

function drawCaps(){
  const rot = projection.rotate(), center = [-rot[0], -rot[1]];
  const fs = Math.max(10, Math.min(16, 10 + (state.scale - 1) * 2.2));
  const vis = [];
  LIST.forEach(c => {
    if (state.cont && c.cont !== state.cont) return;
    const lc = c.lc || [c.lon, c.lat];
    if (d3.geoDistance(lc, center) > Math.PI/2 - 0.08) return;
    const capVis = d3.geoDistance([c.lon, c.lat], center) < Math.PI/2 - 0.04;
    const [x,y] = projection([c.lon, c.lat]);
    const [lx,ly] = projection(lc);
    vis.push({c,x,y,lx,ly,capVis});
  });
  // selected first, then larger countries get priority
  vis.sort((a,b) => (b.c === state.sel) - (a.c === state.sel) || (b.c.area||0) - (a.c.area||0));
  const boxes = [], dr = 4;
  vis.forEach(v => { if (v.capVis) boxes.push({x0:v.x-dr,x1:v.x+dr,y0:v.y-dr,y1:v.y+dr}); });
  const hit = b => boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
  vis.forEach(v => {
    const f = v.c === state.sel ? fs + 4 : fs;
    const w = v.c.name.length * f * 0.5 + 8, h = f + 2;
    v.show = false;
    for (const off of [0, -h*0.75, h*0.75, -h*1.3, h*1.3]){
      const box = {x0:v.lx-w/2, x1:v.lx+w/2, y0:v.ly+off-h/2, y1:v.ly+off+h/2};
      if (!hit(box)){ boxes.push(box); v.show = true; v.oy = off; break; }
    }
  });
  const g = gCaps.selectAll('g.cap').data(vis, d => d.c.id);
  g.exit().remove();
  const e = g.enter().append('g').attr('class','cap');
  e.append('circle').attr('class','cap-dot');
  e.append('text').attr('class','cap-label');
  const m = e.merge(g);
  m.select('circle').attr('cx', d => d.x).attr('cy', d => d.y)
    .attr('r', d => d.c === state.sel ? 6 : 3.2).classed('sel', d => d.c === state.sel)
    .attr('display', d => d.capVis && (d.show || state.scale >= 1.5 || d.c === state.sel) ? null : 'none')
    .on('mousemove', (ev, d) => showTip(ev, d.c)).on('mouseleave', () => tip.style.opacity = 0)
    .on('click', (ev, d) => select(d.c));
  m.select('text').text(d => d.c.name).attr('x', d => d.lx).attr('y', d => d.ly + (d.oy || 0)).attr('dy','.35em').attr('text-anchor','middle')
    .style('font-size', d => (d.c === state.sel ? fs + 4 : fs) + 'px')
    .classed('sel', d => d.c === state.sel)
    .attr('display', d => d.show ? null : 'none');
  m.filter(d => d.c === state.sel).raise();
}

// Rotation animation
let anim = null;
function flyTo(lon, lat, scale){
  const r0 = projection.rotate(), r1 = [-lon, -lat * 0.85, 0];
  const s0 = state.scale, s1 = scale ?? state.scale;
  const ip = d3.interpolate(r0, r1);
  anim && anim.stop();
  const dur = 1100, t0 = performance.now();
  anim = d3.timer(() => {
    const t = Math.min(1, (performance.now() - t0) / dur), k = d3.easeCubicInOut(t);
    projection.rotate(ip(k));
    state.scale = s0 + (s1 - s0) * k;
    projection.scale(baseR * state.scale);
    render();
    if (t >= 1) { anim.stop(); anim = null; }
  });
}

function select(info){
  state.sel = info;
  const card = document.getElementById('card');
  if (!info){ card.classList.remove('show'); render(); return; }
  setSpin(false);
  document.getElementById('c-flag').src = flagUrl(info.iso);
  document.getElementById('c-flag').alt = 'Bandera de ' + info.name;
  document.getElementById('c-name').textContent = info.name;
  document.getElementById('c-cap').textContent = info.cap;
  document.getElementById('c-cont').textContent = CONT[info.cont].n;
  document.getElementById('c-lang').textContent = info.lang;
  card.classList.add('show');
  const f = features.find(f => f.info === info);
  let target = Math.max(state.scale, 1.6);
  if (f){
    const a = d3.geoArea(f);
    target = a > 0.3 ? 1.3 : a > 0.05 ? 1.8 : a > 0.01 ? 2.6 : 3.6;
    const [lon, lat] = d3.geoCentroid(f);
    flyTo(info.cont === 'EU' && info.id === '643' ? 60 : lon, info.id === '643' ? 58 : lat, target);
  } else flyTo(info.lon, info.lat, target);
}

// Drag to rotate
let v0, r0, q0;
svg.call(d3.drag()
  .on('start', ev => {
    anim && anim.stop(); setSpin(false);
    svg.classed('dragging', true);
    r0 = projection.rotate(); v0 = [ev.x, ev.y];
  })
  .on('drag', ev => {
    const k = 75 / projection.scale() * 1.0;
    projection.rotate([r0[0] + (ev.x - v0[0]) * k, Math.max(-85, Math.min(85, r0[1] - (ev.y - v0[1]) * k)), 0]);
    render();
  })
  .on('end', () => svg.classed('dragging', false)));

svg.on('wheel', ev => {
  ev.preventDefault();
  anim && anim.stop();
  state.scale = Math.max(0.7, Math.min(8, state.scale * Math.exp(-ev.deltaY * 0.0015)));
  applyScale();
}, {passive:false});

// Pinch zoom
const touches = new Map(); let pinch0 = null;
stage.addEventListener('pointerdown', e => touches.set(e.pointerId, e));
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, e);
  if (touches.size === 2){
    const [a,b] = [...touches.values()], d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (!pinch0) pinch0 = {d, s:state.scale};
    state.scale = Math.max(0.7, Math.min(8, pinch0.s * d / pinch0.d)); applyScale();
  }
});
['pointerup','pointercancel'].forEach(t => stage.addEventListener(t, e => { touches.delete(e.pointerId); if (touches.size < 2) pinch0 = null; }));

document.getElementById('zin').onclick = () => { anim && anim.stop(); flyTo(-projection.rotate()[0], -projection.rotate()[1]/0.85, Math.min(8, state.scale * 1.5)); };
document.getElementById('zout').onclick = () => { anim && anim.stop(); flyTo(-projection.rotate()[0], -projection.rotate()[1]/0.85, Math.max(0.7, state.scale / 1.5)); };
document.getElementById('close').onclick = () => select(null);

// Auto spin
let spinT = null;
function setSpin(on){
  state.spin = on;
  document.getElementById('spin').classList.toggle('on', on);
  if (on && !spinT){
    let last = performance.now();
    spinT = d3.timer(() => {
      const now = performance.now(), dt = now - last; last = now;
      if (anim) return;
      const r = projection.rotate(); projection.rotate([r[0] + dt * 0.006, r[1], r[2]]); render();
    });
  } else if (!on && spinT){ spinT.stop(); spinT = null; }
}
document.getElementById('spin').onclick = () => setSpin(!state.spin);

// Continent chips
const CONT_VIEW = {AF:[18,3,1.5],EU:[15,52,2.4],AS:[90,35,1.3],NA:[-95,40,1.4],SA:[-60,-18,1.5],OC:[145,-25,1.6]};
const chips = document.getElementById('chips');
function drawChips(){
  chips.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip' + (state.cont ? '' : ' on'); all.innerHTML = '<i style="background:#1f2a44"></i>Todos';
  all.onclick = () => { state.cont = null; drawChips(); flyTo(-projection.rotate()[0], 10, 1); };
  chips.appendChild(all);
  Object.entries(CONT).forEach(([k,v]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (state.cont === k ? ' on' : '');
    b.innerHTML = `<i style="background:${v.c}"></i>${v.n}`;
    b.onclick = () => {
      state.cont = state.cont === k ? null : k; drawChips(); setSpin(false);
      if (state.sel && state.sel.cont !== state.cont) select(null);
      if (state.cont){ const [lon,lat,s] = CONT_VIEW[k]; flyTo(lon, lat/0.85, s); } else render();
    };
    chips.appendChild(b);
  });
}
drawChips();

// Search
const q = document.getElementById('q'), results = document.getElementById('results');
let hits = [], active = 0;
function showResults(){
  const s = norm(q.value.trim());
  if (!s){ results.hidden = true; return; }
  hits = LIST.filter(c => norm(c.name).includes(s) || norm(c.cap).includes(s))
    .sort((a,b) => norm(a.name).startsWith(s) ? -1 : norm(b.name).startsWith(s) ? 1 : 0).slice(0, 8);
  active = 0;
  results.innerHTML = hits.length ? '' : '<button disabled>No encontramos ese lugar</button>';
  hits.forEach((c,i) => {
    const b = document.createElement('button');
    if (i === active) b.classList.add('active');
    b.innerHTML = `<img src="${flagUrl(c.iso)}" alt="">${c.name}<small>${c.cap}</small>`;
    b.onmousedown = e => { e.preventDefault(); pick(c); };
    results.appendChild(b);
  });
  results.hidden = false;
}
function pick(c){ q.value = ''; results.hidden = true; q.blur(); if (state.cont && state.cont !== c.cont){ state.cont = null; drawChips(); } select(c); }
q.addEventListener('input', showResults);
q.addEventListener('blur', () => setTimeout(() => results.hidden = true, 100));
q.addEventListener('keydown', e => {
  const btns = results.querySelectorAll('button');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    btns.forEach((b,i) => b.classList.toggle('active', i === active));
  } else if (e.key === 'Enter' && hits[active]) pick(hits[active]);
  else if (e.key === 'Escape'){ q.value = ''; results.hidden = true; }
});

const LABEL_POS = {'250':[2.5,46.6],'840':[-99,39],'578':[9,61.5],'643':[95,62],'124':[-100,58],'554':[172,-42],'152':[-71,-30],'360':[114,-1],'076':[-52,-10],'208':[9.3,56]};
function showTip(ev, c){
  tip.innerHTML = `<img src="${flagUrl(c.iso)}" alt=""><span style="opacity:.7;font-weight:600">Capital:</span> ${c.cap}`;
  tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 14 + 'px'; tip.style.opacity = 1;
}
// Load geometry
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  features = topojson.feature(topo, topo.objects.countries).features.filter(f => f.id !== '010');
  features.forEach(f => {
    const id = f.id ?? NAME_FALLBACK[f.properties.name];
    f.info = DATA[id] || DATA[NAME_FALLBACK[f.properties.name]] || null;
    if (f.info){
      const a = d3.geoArea(f);
      if (a > (f.info.area || 0)){ f.info.area = a; f.info.lc = LABEL_POS[f.info.id] || d3.geoCentroid(f); }
    }
  });
  gLand.selectAll('path').data(features).join('path')
    .attr('class','country')
    .attr('fill', d => d.info ? CONT[d.info.cont].c : '#e9e2d2')
    .on('click', (ev, d) => { if (d.info) select(d.info); })
    .on('mousemove', (ev, d) => {
      if (!d.info) { tip.style.opacity = 0; return; }
      showTip(ev, d.info);
    })
    .on('mouseleave', () => tip.style.opacity = 0);
  size();
  setSpin(true);
});
window.addEventListener('resize', size);
size();
</script>
</body>
</html>
